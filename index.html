<!DOCTYPE html>
<html lang="es">
<head>
<script>window.onerror=function(m,s,l,c){var d=document.createElement("pre");d.style.cssText="white-space:pre-wrap;color:#a00;padding:16px;font-size:14px";d.textContent="Error: "+m+" (línea "+l+":"+c+")";(document.body||document.documentElement).appendChild(d)};window.addEventListener("unhandledrejection",function(e){window.onerror("Promesa: "+(e.reason&&e.reason.message||e.reason),"",0,0)});</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Rogelio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F3F6F5;--surface:#fff;--ink:#15252A;--muted:#5A6A6F;--line:#D8E0DE;--accent:#1C6A65;--accent-soft:#E0EDEB;--in:#2D7A3D;--in-soft:#E2F0E4;--warn:#9A5D16;--warn-soft:#F6EAD8;--danger:#AF3828;--danger-soft:#F6E0DC;--gold:#B8901F;
--display:"Literata",Georgia,serif;--body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 110px;display:grid;gap:18px}
h1,h2{font-family:var(--display);font-weight:600;margin:0}
h1{font-size:1.6rem}h2{font-size:1.08rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.sub{font-size:.85rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px}
.kpi .v{font-size:1.2rem;font-weight:700;overflow-wrap:anywhere}
.kpi.main{grid-column:1/-1;background:var(--accent);color:#fff;border-color:var(--accent)}
.kpi.main .eyebrow{color:#cfe5e2}.kpi.main .v{font-size:1.6rem}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row .n{font-weight:600;overflow-wrap:anywhere}.row .t{font-size:.8rem;color:var(--muted)}
.row .v{grid-row:1/span 2;grid-column:2;text-align:right;font-weight:700;align-self:center;white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;font-size:.76rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.danger{background:var(--danger-soft);color:var(--danger)}.pill.ok{background:var(--in-soft);color:var(--in)}
.bar{display:grid;grid-template-columns:minmax(0,8.5rem) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.85rem}
.bar .tr{height:8px;background:var(--accent-soft);border-radius:4px;overflow:hidden}.bar .fl{height:100%;background:var(--accent)}
.bar .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:140px;border-bottom:1px solid var(--line)}
.chart .c{display:flex;gap:2px;align-items:end;height:100%;justify-content:center}
.chart .c span{width:42%;border-radius:3px 3px 0 0;min-height:1px}
.chart-l{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;font-size:.68rem;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mov{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:10px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.mov:first-child{border-top:0}
.mov .d{text-align:center;line-height:1.1}.mov .d b{display:block;font-family:var(--display);font-size:1.2rem}.mov .d span{font-size:.68rem;color:var(--muted);text-transform:uppercase}
.mov .x{min-width:0;display:grid;gap:2px}.mov .x .t{font-weight:600;overflow-wrap:anywhere}.mov .x .m{font-size:.78rem;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}.amt.in{color:var(--in)}.amt.mv{color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}
nav button{font:inherit;font-size:.78rem;font-weight:600;background:none;border:0;padding:12px 4px;color:var(--muted);cursor:pointer}
nav button[aria-current="true"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.fab{position:fixed;right:16px;bottom:66px;z-index:21;border-radius:999px;padding:13px 20px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.55}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:grid;gap:4px}.field label,.lab{font-size:.8rem;font-weight:600;color:var(--muted)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.88rem}.check input{width:18px;height:18px;flex:none;margin-top:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-weight:600;border:0;background:var(--surface);color:var(--muted);padding:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.overlay{position:fixed;inset:0;background:rgba(10,20,22,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:18px;display:grid;gap:13px}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.xbtn{font-size:1.5rem;background:none;border:0;color:var(--muted);cursor:pointer}
.err{color:var(--danger);font-size:.86rem}
.cui{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:grid;gap:10px}
canvas.sig{width:100%;height:150px;background:#fff;border:1px dashed #9aa;border-radius:10px;touch-action:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:60;max-width:calc(100% - 32px)}
.empty{text-align:center;color:var(--muted);padding:20px}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:.9rem}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
img.prev{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
[hidden]{display:none!important}
.n .t{display:block;font-weight:400;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:grid;gap:4px">
    <div class="eyebrow">Garantes: Bryan y Marjorie Umaña López</div>
    <h1>Control Rogelio</h1>
    <div class="sub">Exp. 24-002413-0187-FA · Facturas en gastos.roge@gmail.com</div>
  </header>
  <main id="main"><div class="loading">Cargando las cuentas de papi…</div></main>
</div>
<button class="btn primary fab" id="fab" hidden>+ Registrar</button>
<nav id="nav" hidden>
  <button data-v="inicio" aria-current="true">Inicio</button>
  <button data-v="movs">Movimientos</button>
  <button data-v="aporte">Préstamo</button>
  <button data-v="agenda">Agenda</button>
  <button data-v="comp">Compromisos</button>
</nav>
<div id="ov"></div>
<div class="toast" id="toast" hidden></div>

<script>

const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","setiembre","octubre","noviembre","diciembre"];
const M3=["ene","feb","mar","abr","may","jun","jul","ago","set","oct","nov","dic"];
const crc=v=>"₡"+Math.round(Number(v)||0).toLocaleString("es-CR");
const usd=v=>"US$"+(Number(v)||0).toLocaleString("es-CR",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const hoy=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fLarga=s=>{if(!s)return"";const[y,m,d]=s.split("-").map(Number);return d+" "+M3[m-1]+" "+y};
const fCorta=s=>{if(!s)return"___/___/____";const[y,m,d]=s.split("-");return d+"/"+m+"/"+y};
let D=null, vista="inicio", clave=null, cf=null;
try{clave=localStorage.getItem("cr_clave");cf=localStorage.getItem("cr_familia")}catch(e){}

function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3000)}
const API="https://script.google.com/macros/s/AKfycbzmDNt2YFvmCCYNI9tcYv8jPJZ2swykoa_VQ7HX8oZRVj97DcoWY1yNu55aavVORFTG4A/exec";
function run(fn,...args){const c=new AbortController();const t=setTimeout(()=>c.abort(),90000);return fetch(API,{method:"POST",body:JSON.stringify({fn,args}),headers:{"Content-Type":"text/plain;charset=utf-8"},credentials:"omit",signal:c.signal}).then(r=>r.json()).then(j=>{clearTimeout(t);if(!j.ok)throw new Error(j.error);return j.data}).catch(e=>{clearTimeout(t);if(e.name==="AbortError")throw new Error("El servidor no respondió. Revise el internet e intente de nuevo.");if(e instanceof TypeError)throw new Error("No hay conexión con el servidor. Revise el internet e intente de nuevo.");throw e})}
let E={};
function usar(d){if(typeof d==="string")d=JSON.parse(d);if(!d||!d.res)throw new Error("Respuesta vacía del servidor.");D=d;render()}
function cargar(){return run("getDatos",cf).then(usar).catch(e=>{const m=e.message||String(e);if(/incorrecta|familiar/.test(m)){cf=null;try{localStorage.removeItem("cr_familia")}catch(_){}pantallaClave(m);return}$("main").innerHTML=`<div class="card"><b>No se pudieron cargar los datos.</b><span class="sub">${esc(m)}</span><button class="btn" onclick="location.reload()">Volver a intentar</button></div>`})}
function pantallaClave(msg){
  const conf=!E.hayFamilia;
  $("main").innerHTML=`<form class="card" id="fcf" style="max-width:420px;margin:30px auto;width:100%">
  <h2>${conf?"Configurar el acceso":"Clave familiar"}</h2>
  <span class="sub">${conf?"Se crean dos claves. La <b>clave familiar</b> la tienen todos los hermanos y sirve para ver. La <b>clave de garantes</b> es solo para Bryan y Marjorie y sirve para registrar. Use de 4 a 8 números en cada una.":"Para ver las cuentas de papi escriba la clave familiar. Solo se pide una vez en este dispositivo."}</span>
  ${conf?`<label class="sub">${E.hayClave?"Clave de garantes (la que ya crearon)":"Nueva clave de garantes"}</label><input id="cg" type="password" inputmode="numeric" autocomplete="off" placeholder="Clave de garantes">${E.hayClave?"":'<input id="cg2" type="password" inputmode="numeric" autocomplete="off" placeholder="Repita la clave de garantes">'}<label class="sub">Nueva clave familiar</label>`:""}
  <input id="cf1" type="password" inputmode="numeric" autocomplete="off" placeholder="Clave familiar">${conf?'<input id="cf2" type="password" inputmode="numeric" autocomplete="off" placeholder="Repita la clave familiar">':""}
  <div class="err" id="cferr">${esc(msg&&!/creado/.test(msg)?msg:"")}</div><button class="btn primary">${conf?"Crear claves y entrar":"Entrar"}</button></form>`;
  $("fcf").onsubmit=async e=>{e.preventDefault();const f=$("cf1").value.trim();const b=e.target.querySelector("button");
    try{b.disabled=true;
      if(conf){const g=$("cg").value.trim();if(!E.hayClave&&g!==$("cg2").value.trim())throw new Error("Las dos claves de garantes no coinciden.");if(f!==$("cf2").value.trim())throw new Error("Las dos claves familiares no coinciden.");
        await run("configurar",g,f);E.hayFamilia=true;E.hayClave=true;clave=g;try{localStorage.setItem("cr_clave",g)}catch(_){}}
      cf=f;try{localStorage.setItem("cr_familia",f)}catch(_){}
      $("main").innerHTML='<div class="loading">Cargando las cuentas de papi…</div>';await cargar();
    }catch(err){b.disabled=false;$("cferr").textContent=err.message||String(err)}};
}
function monedaCuenta(n){const c=D.cuentas.find(x=>x.nombre===n);return c?c.moneda:"CRC"}

/* ---------- vistas ---------- */
function render(){
  $("nav").hidden=false;$("fab").hidden=false;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.v===vista)));
  $("fab").hidden=vista==="agenda";
  ({inicio:vInicio,movs:vMovs,aporte:vAporte,comp:vComp,agenda:vAgenda})[vista]();
  window.scrollTo(0,0);
}
function vInicio(){
  const r=D.res; // B5..B19
  const pend=Number(r[12])||0, sinc=Number(r[10])||0, extra=Number(r[11])||0, compP=Number(r[14])||0;
  const alerts=[sinc?`<span class="pill warn">${sinc} gasto${sinc>1?"s":""} sin comprobante</span>`:"",extra?`<span class="pill danger">${extra} extraordinario${extra>1?"s":""}: avisar al juzgado</span>`:"",pend?`<span class="pill danger">Intereses de Bryan: ${pend} mes${pend>1?"es":""} pendiente${pend>1?"s":""}</span>`:"",compP?`<span class="pill">${compP} compromiso${compP>1?"s":""} sin cumplir</span>`:""].join("");
  const cats=D.cats.filter(c=>c[1]>0).sort((a,b)=>b[1]-a[1]);const mx=cats[0]?.[1]||1;
  const fam=D.fam.filter(f=>f[1]>0);
  const mm=Math.max(1,...D.meses.flatMap(m=>[m[1],m[2]+m[3]]));
  $("main").innerHTML=`<div style="display:grid;gap:18px">
  <div class="kpis">
    <div class="kpi main"><span class="eyebrow">Disponible en colones</span><span class="v num">${crc(r[0])}</span></div>
    <div class="kpi"><span class="eyebrow">Dólares (BCR)</span><span class="v num">${usd(r[1])}</span></div>
    <div class="kpi"><span class="eyebrow">Venta Tarrazú por cobrar</span><span class="v num">${crc(r[3])}</span></div>
  </div>
  ${alerts?`<div class="pills">${alerts}</div>`:""}
  <section class="card"><div><h2>Periodo del informe</h2><div class="sub">${esc(r[5])}</div></div>
    <div class="row"><span class="n">Ingresos</span><span class="v num" style="color:var(--in)">${crc(r[6])}</span></div>
    <div class="row"><span class="n">Gastos con dinero de papi</span><span class="v num">${crc(r[7])}</span></div>
    <div class="row"><span class="n">Diferencia</span><span class="v num">${crc(r[8])}</span></div>
    <div class="row"><span class="n">Pagado por la familia con dinero propio</span><span class="t">No sale de las cuentas de papi</span><span class="v num">${crc(r[9])}</span></div>
  </section>
  <section class="card"><h2>Por mes</h2>
    <div class="chart">${D.meses.map(m=>`<div class="c" title="${esc(m[0])}"><span style="height:${m[1]/mm*100}%;background:var(--in)"></span><span style="height:${(m[2]+m[3])/mm*100}%;background:linear-gradient(var(--gold) ${m[2]+m[3]?m[3]/(m[2]+m[3])*100:0}%,var(--accent) 0)"></span></div>`).join("")}</div>
    <div class="chart-l">${D.meses.map(m=>`<span>${m[0]?M3[Number(m[0].slice(5,7))-1]:""}</span>`).join("")}</div>
    <div class="legend"><span><i style="background:var(--in)"></i>Ingresos</span><span><i style="background:var(--accent)"></i>Gastos de papi</span><span><i style="background:var(--gold)"></i>Pagado por la familia</span></div>
  </section>
  <section class="card"><h2>Dónde está el dinero</h2>
    ${D.cuentas.map(c=>`<div class="row"><span class="n">${esc(c.nombre)}</span><span class="t">${esc(c.titular)}${c.disponible==="No"?" · no disponible":""}</span><span class="v num">${c.moneda==="USD"?usd(c.saldo):crc(c.saldo)}</span></div>`).join("")}
  </section>
  ${cats.length?`<section class="card"><h2>Gastos por categoría</h2>${cats.map(c=>`<div class="bar"><span class="l">${esc(c[0])}</span><span class="tr"><span class="fl" style="display:block;width:${Math.max(2,c[1]/mx*100)}%"></span></span><span class="num">${crc(c[1])}</span></div>`).join("")}</section>`:""}
  ${fam.length?`<section class="card"><h2>Lo que ha puesto cada hermano</h2>${fam.map(f=>`<div class="row"><span class="n">${esc(f[0])}</span><span class="v num">${crc(f[1])}</span></div>`).join("")}</section>`:""}
  </div>`;
}
function movRow(m){
  const[y,mo,d]=m.fecha.split("-").map(Number); const usdM=m.moneda==="USD";
  const sign=m.tipo==="Ingreso"?"+":m.tipo==="Gasto"?"−":"↔ ";
  const meta=m.tipo==="Traslado"?`${esc(m.cuenta)} → ${esc(m.destino)}`:[m.cat,m.dinero==="Propio de familiar"?"Pagó "+(m.persona||"un familiar")+" con dinero propio":m.cuenta].filter(Boolean).map(esc).join(" · ");
  const pills=[(m.tipo==="Gasto"&&(!m.comp||m.comp==="No"))?'<span class="pill warn">Sin comprobante</span>':"",m.extra?'<span class="pill danger">Extraordinario</span>':"",m.recibo?'<span class="pill ok">Recibo firmado</span>':""].join("");
  return `<div class="mov" data-f="${m.fila}"><div class="d"><b>${d}</b><span>${M3[mo-1]}</span></div><div class="x"><span class="t">${esc(m.desc)}</span><span class="m">${meta}</span>${pills?`<div class="pills">${pills}</div>`:""}</div><span class="amt num ${m.tipo==="Ingreso"?"in":m.tipo==="Traslado"?"mv":""}">${sign}${usdM?usd(m.monto):crc(m.monto)}</span></div>`;
}
function vMovs(){
  const g={};D.movs.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.fila-a.fila).forEach(m=>(g[m.fecha.slice(0,7)]||=[]).push(m));
  const ks=Object.keys(g);
  $("main").innerHTML=ks.length?`<div style="display:grid;gap:16px">${ks.map(k=>{const[y,m]=k.split("-").map(Number);return `<section class="card"><h2>${MES[m-1][0].toUpperCase()+MES[m-1].slice(1)} ${y}</h2><div>${g[k].map(movRow).join("")}</div></section>`}).join("")}</div>`:`<div class="card empty">Todavía no hay movimientos. Use <b>+ Registrar</b> para anotar el primero.</div>`;
  document.querySelectorAll(".mov").forEach(e=>e.onclick=()=>detalle(Number(e.dataset.f)));
}
function vAporte(){
  const a=D.aporte; const pend=a.filter(x=>x.estado==="Pendiente");
  $("main").innerHTML=`<section class="card"><div><h2>Préstamo de Bryan</h2><div class="sub">Debe ${crc((D.cuentas.find(c=>/Préstamo a Bryan/.test(c.nombre))||{saldo:1000000}).saldo)} a papi y paga 2% mensual de intereses (₡20.000 al mes)</div></div>
  ${pend.length?`<span class="pill danger">${pend.length} mes${pend.length>1?"es":""} pendiente${pend.length>1?"s":""} · ${crc(pend.reduce((s,x)=>s+x.pendiente,0))}</span>`:`<span class="pill ok">Al día</span>`}
  <div>${a.filter(x=>x.estado!=="Próximo").reverse().map(x=>{const[y,m]=x.mes.split("-").map(Number);const cls={Pagado:"ok",Pendiente:"danger","Este mes":"warn"}[x.estado]||"";return `<div class="row"><span class="n">${MES[m-1][0].toUpperCase()+MES[m-1].slice(1)} ${y}</span><span class="t">Pagado ${crc(x.pagado)}</span><span class="v"><span class="pill ${cls}">${esc(x.estado)}</span></span></div>`}).join("")}</div>
  <span class="sub">Para registrar un pago: <b>+ Registrar</b> → Ingreso → categoría "Intereses préstamo Bryan".</span></section>`;
}
function vComp(){
  $("main").innerHTML=`<section class="card"><h2>Compromisos ante el juzgado</h2><span class="sub">Del informe presentado el 14/10/2026</span>
  <div>${D.comp.map(c=>`<div class="row" style="grid-template-columns:minmax(0,1fr)"><span class="n" style="font-weight:500">${esc(c.texto)}</span>
  <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select data-f="${c.fila}" style="width:auto">${D.listas.estados.map(e=>`<option ${e===c.estado?"selected":""}>${esc(e)}</option>`).join("")}</select>${c.fecha?`<span class="sub">Cumplido el ${fLarga(c.fecha)}</span>`:""}</span></div>`).join("")}</div></section>`;
  document.querySelectorAll("select[data-f]").forEach(s=>s.onchange=async()=>{

  if(file.size>15e6) return ko(new Error("El archivo pesa más de 15 MB."));
  const r=new FileReader();r.onload=()=>ok({b64:String(r.result).split(",")[1],tipo:file.type||"application/pdf",nombre:file.name});r.onerror=ko;r.readAsDataURL(file)})}

  if(mi)s.push(mi===1?"un millón":ap(l999(mi))+" millones");if(k)s.push(k===1?"mil":ap(l999(k))+" mil");if(r)s.push(l999(r));return s.join(" ")}
function dibujarRecibo(m,rc){

  const pend=a.tareas.filter(t=>t.estado!=="Hecho"), hechas=a.tareas.filter(t=>t.estado==="Hecho");
  const limiteT=t=>t.id.startsWith("REC-")?t.fecha.slice(0,8)+"05":t.fecha;
  const citasF=a.citas.filter(c=>c.fecha>=h), citasP=a.citas.filter(c=>c.fecha<h).reverse().slice(0,3);
  const dias14=[];for(let i=0;i<14;i++)dias14.push(sumD(h,i));
  const ing=Object.fromEntries(a.ingrid.map(x=>[x.fecha,x]));
  $("main").innerHTML=`
  <section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>Agenda de papi</h2>
    <button class="btn" id="yoBtn" style="padding:5px 10px;font-size:.8rem">${yo?"Soy "+esc(yo):"¿Quién es usted?"}</button></div>
    <span class="sub">${capi(fDia(h))}</span></section>

  <section class="card"><h2>Pastillas de hoy</h2>
    ${dosisBtn(dHoy,"Mañana","manana","10:00",dHoy.respManana)}
    ${dosisBtn(dHoy,"Noche","noche","22:00",dHoy.respNoche)}
    ${atras.length?`<span class="sub" style="margin-top:6px">Días anteriores sin marcar:</span>${atras.map(d=>(d.manana?"":dosisBtn(d,"Mañana del "+fDia(d.fecha),"manana","00:00",d.respManana))+(d.noche?"":dosisBtn(d,"Noche del "+fDia(d.fecha),"noche","00:00",d.respNoche))).join("")}`:""}
  </section>

  <section class="card"><h2>Turno de esta semana</h2>
    <div class="row"><span class="n" style="font-size:1.15rem;font-weight:700">${esc(tAct.hermano)}</span><span class="v">${capi(fDia(tAct.dia))}</span></div>
    <div class="row"><span class="n">Pastillero de la semana</span><span class="v">${tAct.pastillero?`<span class="pill ok">Listo · ${esc(tAct.pastilleroPor)}</span>`:`<button class="btn primary" id="pastBtn">Marcar listo</button>`}</span></div>
    ${tAct.nota?`<div class="sub" style="white-space:pre-wrap">📝 ${esc(tAct.nota)}</div>`:""}
    <div class="pills"><button class="btn" id="tDia">Cambiar día</button><button class="btn" id="tHer">Cambiar con otro hermano</button><button class="btn" id="tNota">${tAct.nota?"Cambiar nota":"Nota del turno"}</button></div>
    <span class="sub" style="margin-top:6px">Próximos turnos</span>
    ${prox.map(t=>`<div class="row"><span class="n">${esc(t.hermano)}${t.cambiado?' <span class="pill warn">cambiado</span>':""}</span><span class="v sub">${fDia(t.dia)}</span></div>`).join("")}
  </section>

  <section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Tareas</h2><button class="btn" id="addTarea">+ Tarea</button></div>
    ${pend.length?pend.map(t=>{const at=h>limiteT(t);return `<div class="row"><span class="n">${esc(t.titulo)}<span class="t">${esc(t.responsable||"Sin responsable")} · ${t.id.startsWith("REC-")?"del 1 al 5":fDia(t.fecha)}${t.notas&&!t.id.startsWith("REC-")?" · "+esc(t.notas):""}</span></span><span class="v">${at?'<span class="pill danger">Atrasada</span> ':""}<button class="btn" data-hecho="${t.id}">Hecho</button></span></div>`}).join(""):'<span class="sub">No hay tareas pendientes.</span>'}
    ${hechas.length?`<details><summary class="sub">Hechas recientemente (${hechas.length})</summary>${hechas.map(t=>`<div class="row"><span class="n" style="text-decoration:line-through;color:var(--muted)">${esc(t.titulo)}</span><span class="v sub">${esc(t.hechoPor)} · ${esc((t.hechoEl||"").slice(5,10))}</span></div>`).join("")}</details>`:""}
  </section>

  <section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Citas médicas</h2><button class="btn" id="addCita">+ Cita</button></div>
    ${citasF.length?citasF.map(c=>`<div class="row" data-cita="${c.id}" style="cursor:pointer"><span class="n">${esc(c.titulo)}<span class="t">${esc(c.lugar||"")}${c.responsable?" · acompaña "+esc(c.responsable):""}</span></span><span class="v"><b>${capi(fDia(c.fecha))}</b><br><span class="sub">${esc(c.hora||"")}</span></span></div>`).join(""):'<span class="sub">No hay citas próximas.</span>'}
    ${citasP.length?`<details><summary class="sub">Citas pasadas</summary>${citasP.map(c=>`<div class="row" data-cita="${c.id}"><span class="n">${esc(c.titulo)}</span><span class="v sub">${fDia(c.fecha)}</span></div>`).join("")}</details>`:""}
  </section>

  <section class="card"><h2>Doña Ingrid</h2><span class="sub">Toque un día para marcar si viene o no. Lo coordina ${esc((a.responsables["Días de Doña Ingrid"]||{}).semana||"Bryan")}.</span>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">${dias14.map(f=>{const x=ing[f];return `<button class="btn" data-ing="${f}" style="padding:6px 2px;font-size:.75rem;${x?"background:var(--accent);color:#fff;border-color:var(--accent)":""}">${DSEM[dowS(f)].slice(0,3)}<br><b>${Number(f.slice(8))}</b>${x?`<br>${esc(x.hora)}`:""}</button>`}).join("")}</div>
  </section>
  <section class="card"><h2>Responsables</h2><span class="sub">Toque un nombre para cambiarlo. El calendario se actualiza solo.</span>
    <div class="row"><span class="n sub">Tarea</span><span class="v sub">Lun–jue · Vie–dom</span></div>
    ${Object.entries(a.responsables).map(([t,r])=>`<div class="row"><span class="n">${esc(t)}</span><span class="v"><button class="btn" style="padding:4px 9px" data-resp="${esc(t)}" data-g="semana">${esc(r.semana||"—")}</button> <button class="btn" style="padding:4px 9px" data-resp="${esc(t)}" data-g="finde">${esc(r.finde||"—")}</button></span></div>`).join("")}
  </section>`;
  $("yoBtn").onclick=()=>{yo=null;try{localStorage.removeItem("cr_yo")}catch(_){}pedirYo()};
  document.querySelectorAll("[data-dosis]").forEach(b=>b.onclick=()=>{b.disabled=true;accion("marcarDosis",[b.dataset.dosis,"__YO__",b.dataset.f],"Dosis marcada").finally(()=>b.disabled=false)});
  if($("pastBtn"))$("pastBtn").onclick=()=>accion("turnoAccion",[tAct.domingo,{pastillero:true},"__YO__"],"Pastillero listo");
  $("tDia").onclick=()=>formTurno(tAct,"dia");$("tHer").onclick=()=>formTurno(tAct,"hermano");$("tNota").onclick=()=>formTurno(tAct,"nota");
  $("addTarea").onclick=()=>formItem("Tarea");$("addCita").onclick=()=>formItem("Cita");
  document.querySelectorAll("[data-hecho]").forEach(b=>b.onclick=()=>{b.disabled=true;accion("completarItem",[b.dataset.hecho,"__YO__",true],"Tarea marcada como hecha")});
  document.querySelectorAll("[data-cita]").forEach(r=>r.onclick=()=>formItem("Cita",a.citas.find(c=>c.id===r.dataset.cita)));
  document.querySelectorAll("[data-resp]").forEach(b=>b.onclick=()=>{const t=b.dataset.resp,g=b.dataset.g;
    hoja("Responsable",`<span class="sub">${esc(t)} · ${g==="finde"?"viernes a domingo":"lunes a jueves"}</span><div class="field"><select id="rS">${opts(A.hermanos,b.textContent)}</select></div>`,
      async q=>{await run("setResponsable",cf,t,g,$("rS").value,q);toast("Responsable cambiado")})});
  document.querySelectorAll("[data-ing]").forEach(b=>b.onclick=()=>formIngrid(b.dataset.ing,ing[b.dataset.ing]));
}
function hoja(titulo,cuerpo,onOk,extraBtn){
  if(!yo){pedirYo().then(q=>{if(q)hoja(titulo,cuerpo,onOk,extraBtn)});return}
  $("ov").innerHTML=`<div class="overlay"><form class="sheet" id="fa"><div class="sheet-h"><h2>${titulo}</h2><button type="button" class="xbtn" id="ax">×</button></div>${cuerpo}
  <div class="err" id="aerr"></div><div class="pills">${extraBtn||""}<button class="btn primary" style="flex:1">Guardar</button></div></form></div>`;
  $("ax").onclick=cerrar;
  $("fa").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector(".btn.primary");b.disabled=true;
    try{await onOk(yo);cerrar();await vAgenda()}catch(err){b.disabled=false;$("aerr").textContent=err.message}};
}
function formTurno(t,que){
  if(!yo){pedirYo().then(q=>{if(q)formTurno(t,que)});return}
  const H=A.hermanos;
  if(que==="dia"){const dias=[-2,-1,0].map(n=>sumD(t.domingo,n));
    hoja("Cambiar el día del turno",`<span class="sub">El turno de ${esc(t.hermano)} puede ser viernes, sábado o domingo de esa semana.</span><div class="field"><label for="tdS">Día</label><select id="tdS">${dias.map(d=>`<option value="${d}" ${d===t.dia?"selected":""}>${capi(fDia(d))}</option>`).join("")}</select></div>`,
      async q=>{await run("turnoAccion",cf,t.domingo,{dia:$("tdS").value},q);toast("Día cambiado")});}
  if(que==="hermano"){
    hoja("Cambiar el turno",`<span class="sub">Si cambia con otro hermano, acuérdense de cambiar también el turno de ese hermano.</span><div class="field"><label for="thS">¿Quién hace el turno del ${fDia(t.dia)}?</label><select id="thS">${opts(H,t.hermano)}</select></div>`,
      async q=>{await run("turnoAccion",cf,t.domingo,{hermano:$("thS").value},q);toast("Turno cambiado")});}
  if(que==="nota"){
    hoja("Nota del turno",`<span class="sub">Cómo estuvo papi, si comió bien, si pasó algo… Así el siguiente sabe cómo lo deja.</span><div class="field"><textarea id="tnT" rows="5" maxlength="900">${esc((t.nota||"").replace(/ — [^—]*$/,""))}</textarea></div>`,
      async q=>{await run("turnoAccion",cf,t.domingo,{nota:$("tnT").value.trim()},q);toast("Nota guardada")});}
}
function formItem(tipo,it){
  if(!yo){pedirYo().then(q=>{if(q)formItem(tipo,it)});return}
  const H=A.hermanos; it=it||{};
  const cuerpo=tipo==="Cita"?`
    <div class="field"><label for="iT">¿Qué cita es?</label><input id="iT" maxlength="150" placeholder="Ej.: Control de presión – EBAIS" value="${esc(it.titulo||"")}"></div>
    <div class="g2"><div class="field"><label for="iF">Fecha</label><input type="date" id="iF" value="${it.fecha||hoy()}"></div><div class="field"><label for="iH">Hora</label><input type="time" id="iH" value="${it.hora||"08:00"}"></div></div>
    <div class="field"><label for="iL">Lugar</label><input id="iL" maxlength="150" value="${esc(it.lugar||"")}"></div>
    <div class="field"><label for="iR">¿Quién lo acompaña?</label><select id="iR"><option value="">Por definir</option>${opts(H,it.responsable)}</select></div>
    <div class="field"><label for="iN">Notas</label><textarea id="iN" rows="3" maxlength="900" placeholder="Ej.: llevar el carné y los exámenes">${esc(it.notas||"")}</textarea></div>`
  :`<div class="field"><label for="iT">¿Qué hay que hacer?</label><input id="iT" maxlength="150" placeholder="Ej.: Llevar a papi a sacarse sangre"></div>
    <div class="g2"><div class="field"><label for="iF">Para cuándo</label><input type="date" id="iF" value="${hoy()}"></div><div class="field"><label for="iR">Responsable</label><select id="iR">${opts(H,yo||"")}</select></div></div>
    <div class="field"><label for="iN">Notas</label><textarea id="iN" rows="2" maxlength="900"></textarea></div>`;
  hoja(it.id?"Cita":(tipo==="Cita"?"Nueva cita médica":"Nueva tarea"),cuerpo,async q=>{
    await run("guardarItem",cf,{id:it.id||"",tipo,titulo:$("iT").value.trim(),fecha:$("iF").value,hora:$("iH")?$("iH").value:"",lugar:$("iL")?$("iL").value.trim():"",responsable:$("iR").value,notas:$("iN").value.trim()},q);
    toast(tipo==="Cita"?"Cita guardada":"Tarea agregada")},
    it.id?`<button type="button" class="btn" id="iDel">Borrar</button>`:"");
  if($("iDel"))$("iDel").onclick=async()=>{if(!confirm("¿Borrar esta cita?"))return;try{await run("borrarItem",cf,it.id);cerrar();toast("Cita borrada");await vAgenda()}catch(e){$("aerr").textContent=e.message}};
}
function formIngrid(f,x){
  if(!yo){pedirYo().then(q=>{if(q)formIngrid(f,x)});return}
  let def={d:"08:00",h:"14:00"};try{def=JSON.parse(localStorage.getItem("cr_ing"))||def}catch(_){}
  hoja("Doña Ingrid – "+fDia(f),`<span class="sub">${x?"Está marcado que viene este día.":"¿Viene este día?"}</span>
    <div class="g2"><div class="field"><label for="gD">Desde</label><input type="time" id="gD" value="${x?x.hora:def.d}"></div><div class="field"><label for="gH">Hasta</label><input type="time" id="gH" value="${x?x.horaFin:def.h}"></div></div>`,
    async q=>{try{localStorage.setItem("cr_ing",JSON.stringify({d:$("gD").value,h:$("gH").value}))}catch(_){}await run("ingridDia",cf,f,true,$("gD").value,$("gH").value,q);toast("Día de Doña Ingrid guardado")},
    x?`<button type="button" class="btn" id="gNo">No viene</button>`:"");
  if($("gNo"))$("gNo").onclick=async()=>{try{await run("ingridDia",cf,f,false,"","",yo||"");cerrar();toast("Día quitado");await vAgenda()}catch(e){$("aerr").textContent=e.message}};
}

</script>
</body>
</html>
